[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaturanga-zero"
version = "0.1.0"
description = "AlphaZero-style self-play agent for Chaturanga"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.4"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=7", "httpx2", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.setuptools]
packages = ["chaturanga", "chaturanga_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
