[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaturanga-zero"
version = "0.1.0"
description = "AlphaZero-style self-play agent for Chaturanga"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["chaturanga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
