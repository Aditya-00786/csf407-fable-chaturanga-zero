<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn and play Chaturanga, the ancient Indian ancestor of chess. ChaturangZero, a CS F407 project by Team Fable." />
    <title>ChaturangZero</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('cz-theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
